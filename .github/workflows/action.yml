name: Java CI with Maven

# *1,修改成你的分支
on:
  push:
    branches: [ boot270-docker ]
  pull_request:
    branches: [ boot270-docker ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 1.8
      uses: actions/setup-java@v1
      with:
        java-version: 1.8
    - name: Build with Maven
      run: mvn -B package --file pom.xml

    # 2 Docker相关操作
    # *2.1 --file默认在action的同目录寻找，如果不在相同目录要指定Dockerfile的目录 --tag后可以修改成你的镜像名称
    - name: BuildDockerImage
      run: docker build . --file  boot270/Dockerfile --tag my-image-name:$(date +%s)
    # 2.2 发布到DockerHub  (uses固定使用elgohr大神的action不需要修改)
    - name: Publish to Docker Repository
      uses: elgohr/Publish-Docker-Github-Action@v5
    # *2.3 name改成你DockerHub仓库地址：username和password这里改成你GitHub中配置的敏感环境变量
      with:
        name: keygenee/priv-demo:iamtagname
        password: ${{ secrets.INPUT_PASSWORD }}
        username: ${{ secrets.INPUT_USERNAME }}
        dockerfile: ./boot270/Dockerfile
